{% extends 'base.html' %}

{% block title %}Контакты — Skystore{% endblock %}

{% block content %}
<div class="container">

    <div class="text-center py-5">
        <h1 class="display-5 fw-bold">Контакты</h1>
        <p class="text-muted">Свяжитесь с нами любым удобным способом</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card custom-card shadow-smh-100">
                <div class="card-header bg-light py-3">
                    <h5 class="mb-0">Реквизиты</h5>
                </div>
                <div class="card-body">
                    <table class="table table-borderless mb-0">
                        <tr>
                            <td class="text-muted" style="width: 150px;">Страна</td>
                            <td>USA</td>
                        </tr>
                        <tr>
                            <td class="text-muted">ИНН</td>
                            <td>91-1144442</td>
                        </tr>
                        <tr>
                            <td class="text-muted">Адрес</td>
                            <td>Redmond, WA, 98052-6399</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card custom-card shadow-sm h-100">
                <div class="card-header bg-light py-3">
                    <h5 class="mb-0">Напишите нам</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="text" name="name" class="form-control" placeholder="Ваше имя" required>
                        </div>
                        <div class="mb-3">
                            <input type="tel" name="phone" class="form-control" placeholder="Телефон" required>
                        </div>
                        <div class="mb-3">
                            <textarea name="message" class="form-control" rows="3" placeholder="Сообщение" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
