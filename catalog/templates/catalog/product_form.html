{% extends 'base.html' %}

{% block title %}Товар — Skystore{% endblock %}

{% block content %}
<div class="container">

    <div class="text-center py-5">
        <h1 class="display-6 fw-bold">Карточка товара</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Отправить на модерацию</button>
                            <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
