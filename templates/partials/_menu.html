<nav class="d-flex justify-content-between align-items-center flex-grow-1">
    {# Левая часть — основное меню #}
    <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:home' %}">Главная</a>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:product_list' %}">Каталог</a>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'blogs:blogpost_list' %}">Блог</a>
    </div>

    {# Правая часть — авторизация #}
    <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
            <span class="text-muted small">{{ user.email }}</span>
            <form method="post" action="{% url 'users:logout' %}" class="d-inline m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-primary btn-sm" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </div>
</nav>
